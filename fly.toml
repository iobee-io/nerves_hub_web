# fly.toml app configuration file generated for nerves-hub-v2 on 2026-09-16T21:40:45-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nerves-hub-v2'
primary_region = 'iad'
kill_signal = 'SIGTERM'

[build]
[deploy]
  release_command = 'eval "NervesHub.Release.Tasks.migrate()"'

[env]
  HOST = 'nerves-hub-v2.fly.dev'
  PORT = '8080'
  NERVES_HUB_APP = 'all'
  ATOMVM_FIRMWARE_ENABLED = 'true'
  FIRMWARE_UPLOAD_BACKEND = 'S3'
  S3_HTTP2_ENABLED = 'true'
  # Fly apps only get one *.fly.dev hostname (no subdomain delegation), so
  # the device socket has to share it with the web app rather than living at
  # its own "device." subdomain, which never had a DNS record.
  DEVICE_HOST = 'nerves-hub-v2.fly.dev'
  DEVICE_PORT = '4001'
  DATABASE_POOL_SIZE = '5'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

# The device socket does its own TLS (mTLS, client certs) on DEVICE_PORT, so
# this is a raw TCP passthrough: no [[services.ports]] "handlers", or Fly
# would terminate TLS itself before the app ever sees the handshake.
[[services]]
  internal_port = 4001
  protocol = 'tcp'
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[services.ports]]
    port = 4001

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
